{% extends "base.html" %}
{% block title %}Admin — DaServer Chat{% endblock %}
{% block body_class %}admin-page{% endblock %}

{% block body %}
<div class="admin-layout">
    <header class="admin-header">
        <a href="{{ url_for('chat.index') }}" class="back-link">&larr; Back to chat</a>
        <h1>Admin Panel</h1>
        <a href="{{ url_for('auth.logout') }}" class="icon-btn" title="Logout" aria-label="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
    </header>

    <main class="admin-content">
        <div class="admin-loading" id="adminLoading">Loading users...</div>
        <div class="admin-error hidden" id="adminError"></div>
        <table class="admin-table" id="adminTable">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Admin</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </main>

    <!-- Change password modal -->
    <div class="modal-overlay hidden" id="changePasswordModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Change password</h3>
                <button class="icon-btn modal-close" id="changePasswordModalClose" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-info">Changing password for: <strong id="changePasswordUsername"></strong></p>
                <div class="form-group">
                    <label for="newPasswordInput">New password</label>
                    <input type="password" id="newPasswordInput" placeholder="Min 6 characters" required minlength="6" aria-label="New password">
                </div>
                <div class="modal-error hidden" id="changePasswordError"></div>
                <button class="btn btn-primary btn-full" id="changePasswordSubmit">Update Password</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}

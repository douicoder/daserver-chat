{% extends "base.html" %}
{% block title %}Register — DaServer Chat{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">DaServer Chat</h1>
        <p class="auth-subtitle">Create your account</p>

        {% if error %}
        <div class="auth-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username | default('') }}" required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
